name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Κάνουμε expose το secret ως env var για να μπορούμε να το τσεκάρουμε σε if:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test (Spring profile = test)
        run: ./mvnw -B verify -Dspring.profiles.active=test

      - name: Summarize test results
        if: always()
        id: tests
        run: |
          set -e
          DIR="target/surefire-reports"
          if [ -d "$DIR" ] && ls "$DIR"/*.xml >/dev/null 2>&1; then
            tests=$(grep -hoP 'tests="\K\d+' "$DIR"/*.xml | awk '{s+=$1} END{print s+0}')
            failures=$(grep -hoP 'failures="\K\d+' "$DIR"/*.xml | awk '{s+=$1} END{print s+0}')
            errors=$(grep -hoP 'errors="\K\d+' "$DIR"/*.xml | awk '{s+=$1} END{print s+0}')
            skipped=$(grep -hoP 'skipped="\K\d+' "$DIR"/*.xml | awk '{s+=$1} END{print s+0}')
          else
            tests=0; failures=0; errors=0; skipped=0
          fi
          echo "tests=$tests" >> $GITHUB_OUTPUT
          echo "failures=$failures" >> $GITHUB_OUTPUT
          echo "errors=$errors" >> $GITHUB_OUTPUT
          echo "skipped=$skipped" >> $GITHUB_OUTPUT

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Notify Discord on failure (embed)
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && env.DISCORD_WEBHOOK != '' }}
        run: |
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PAYLOAD=$(cat <<EOF
          {
            "username": "CI Bot",
            "embeds": [{
              "title": "Build failed ❌",
              "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "description": "Repository: **${GITHUB_REPOSITORY}**\\nRef: **${GITHUB_REF}**\\nCommit: **${GITHUB_SHA}**",
              "color": 16711680,
              "fields": [
                {"name": "Workflow", "value": "${GITHUB_WORKFLOW}", "inline": true},
                {"name": "Job", "value": "${GITHUB_JOB}", "inline": true},
                {"name": "Actor", "value": "${GITHUB_ACTOR}", "inline": true},
                {"name": "Tests", "value": "Total: ${{ steps.tests.outputs.tests }}\\nFailures: ${{ steps.tests.outputs.failures }}\\nErrors: ${{ steps.tests.outputs.errors }}\\nSkipped: ${{ steps.tests.outputs.skipped }}", "inline": false}
              ],
              "timestamp": "$TS"
            }]
          }
          EOF
          )
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Notify Discord on success (embed)
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && env.DISCORD_WEBHOOK != '' }}
        run: |
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PAYLOAD=$(cat <<EOF
          {
            "username": "CI Bot",
            "embeds": [{
              "title": "Build passed ✅",
              "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "description": "Repository: **${GITHUB_REPOSITORY}**\\nRef: **${GITHUB_REF}**\\nCommit: **${GITHUB_SHA}**",
              "color": 52224,
              "fields": [
                {"name": "Workflow", "value": "${GITHUB_WORKFLOW}", "inline": true},
                {"name": "Job", "value": "${GITHUB_JOB}", "inline": true},
                {"name": "Actor", "value": "${GITHUB_ACTOR}", "inline": true},
                {"name": "Tests", "value": "Total: ${{ steps.tests.outputs.tests }}\\nFailures: ${{ steps.tests.outputs.failures }}\\nErrors: ${{ steps.tests.outputs.errors }}\\nSkipped: ${{ steps.tests.outputs.skipped }}", "inline": false}
              ],
              "timestamp": "$TS"
            }]
          }
          EOF
          )
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"